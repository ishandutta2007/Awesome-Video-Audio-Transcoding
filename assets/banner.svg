<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#181335"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Waveform Gradients -->
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="pillGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.22  0 0 0 0 0.74  0 0 0 0 0.97  0 0 0 0.4 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes floatBlob1 {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(40px, -25px) scale(1.08); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      @keyframes floatBlob2 {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-35px, 30px) scale(1.12); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      @keyframes pulseRing {
        0%, 100% { transform: scale(1); opacity: 0.35; }
        50% { transform: scale(1.15); opacity: 0.65; }
      }
      @keyframes waveBar {
        0%, 100% { transform: scaleY(0.25); }
        50% { transform: scaleY(1); }
      }
      @keyframes streamDash {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }

      .blob1 {
        animation: floatBlob1 12s ease-in-out infinite;
        transform-origin: center;
      }
      .blob2 {
        animation: floatBlob2 15s ease-in-out infinite;
        transform-origin: center;
      }
      .pulsing-ring {
        animation: pulseRing 4s ease-in-out infinite;
        transform-origin: center;
      }
      .stream-line {
        stroke-dasharray: 8 12;
        animation: streamDash 3s linear infinite;
      }
      .wb-1 { animation: waveBar 1.2s ease-in-out infinite 0.1s; transform-origin: bottom; }
      .wb-2 { animation: waveBar 1.4s ease-in-out infinite 0.3s; transform-origin: bottom; }
      .wb-3 { animation: waveBar 0.9s ease-in-out infinite 0.6s; transform-origin: bottom; }
      .wb-4 { animation: waveBar 1.6s ease-in-out infinite 0.2s; transform-origin: bottom; }
      .wb-5 { animation: waveBar 1.1s ease-in-out infinite 0.5s; transform-origin: bottom; }
      .wb-6 { animation: waveBar 1.5s ease-in-out infinite 0.4s; transform-origin: bottom; }
      .wb-7 { animation: waveBar 1.0s ease-in-out infinite 0.7s; transform-origin: bottom; }
      .wb-8 { animation: waveBar 1.3s ease-in-out infinite 0.2s; transform-origin: bottom; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGradient)"/>
  <rect width="1196" height="416" x="2" y="2" rx="19" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Dynamic Ambient Glow Blobs in Background -->
  <g opacity="0.45">
    <circle class="blob1" cx="240" cy="110" r="160" fill="url(#accentCyan)" filter="url(#glow)"/>
    <circle class="blob2" cx="980" cy="280" r="180" fill="url(#accentPurple)" filter="url(#glow)"/>
    <circle class="pulsing-ring" cx="600" cy="210" r="220" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.25"/>
  </g>

  <!-- Grid Tech Lines (Subtle Background) -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="420" stroke-dasharray="4 8"/>
    <line x1="300" y1="0" x2="300" y2="420" stroke-dasharray="4 8"/>
    <line x1="500" y1="0" x2="500" y2="420" stroke-dasharray="4 8"/>
    <line x1="700" y1="0" x2="700" y2="420" stroke-dasharray="4 8"/>
    <line x1="900" y1="0" x2="900" y2="420" stroke-dasharray="4 8"/>
    <line x1="1100" y1="0" x2="1100" y2="420" stroke-dasharray="4 8"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke-dasharray="4 8"/>
    <line x1="0" y1="280" x2="1200" y2="280" stroke-dasharray="4 8"/>
  </g>

  <!-- Transcoding Pipeline Stream Line (Dynamic Animated) -->
  <g opacity="0.35">
    <path class="stream-line" d="M 50 350 Q 300 380 600 340 T 1150 360" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <path class="stream-line" d="M 50 70 Q 300 40 600 80 T 1150 60" fill="none" stroke="#a855f7" stroke-width="2"/>
  </g>

  <!-- Animated Soundwave Equalizer on Right Flank -->
  <g transform="translate(1030, 240)" opacity="0.75">
    <rect class="wb-1" x="0" y="-70" width="6" height="70" rx="3" fill="url(#waveGrad)"/>
    <rect class="wb-2" x="12" y="-95" width="6" height="95" rx="3" fill="url(#waveGrad)"/>
    <rect class="wb-3" x="24" y="-50" width="6" height="50" rx="3" fill="url(#waveGrad)"/>
    <rect class="wb-4" x="36" y="-110" width="6" height="110" rx="3" fill="url(#waveGrad)"/>
    <rect class="wb-5" x="48" y="-80" width="6" height="80" rx="3" fill="url(#waveGrad)"/>
    <rect class="wb-6" x="60" y="-100" width="6" height="100" rx="3" fill="url(#waveGrad)"/>
    <rect class="wb-7" x="72" y="-60" width="6" height="60" rx="3" fill="url(#waveGrad)"/>
    <rect class="wb-8" x="84" y="-85" width="6" height="85" rx="3" fill="url(#waveGrad)"/>
  </g>

  <!-- Animated Soundwave Equalizer on Left Flank -->
  <g transform="translate(70, 240)" opacity="0.75">
    <rect class="wb-8" x="0" y="-75" width="6" height="75" rx="3" fill="url(#waveGrad)"/>
    <rect class="wb-6" x="12" y="-105" width="6" height="105" rx="3" fill="url(#waveGrad)"/>
    <rect class="wb-3" x="24" y="-55" width="6" height="55" rx="3" fill="url(#waveGrad)"/>
    <rect class="wb-5" x="36" y="-85" width="6" height="85" rx="3" fill="url(#waveGrad)"/>
    <rect class="wb-2" x="48" y="-95" width="6" height="95" rx="3" fill="url(#waveGrad)"/>
    <rect class="wb-1" x="60" y="-60" width="6" height="60" rx="3" fill="url(#waveGrad)"/>
    <rect class="wb-4" x="72" y="-110" width="6" height="110" rx="3" fill="url(#waveGrad)"/>
    <rect class="wb-7" x="84" y="-50" width="6" height="50" rx="3" fill="url(#waveGrad)"/>
  </g>

  <!-- FOREGROUND CONTENT: Completely crisp, prominent, high contrast, never obscured -->
  
  <!-- Pill Header Badge -->
  <g transform="translate(600, 68)">
    <rect x="-185" y="-16" width="370" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
    <text text-anchor="middle" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#38bdf8" letter-spacing="2">
      ⚡ ULTIMATE TRANSCODING ECOSYSTEM ⚡
    </text>
  </g>

  <!-- Main Title -->
  <!-- Subtle dark drop shadow for maximum crispness -->
  <text x="600" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="900" fill="#000000" opacity="0.6" letter-spacing="-0.5">
    Awesome Video &amp; Audio Transcoding
  </text>
  <text x="600" y="146" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="900" fill="url(#primaryGrad)" letter-spacing="-0.5">
    Awesome Video &amp; Audio Transcoding
  </text>

  <!-- Subtitle -->
  <text x="600" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
    Enterprise SaaS APIs • Open-Source FFmpeg GUIs • Hardware Acceleration • Lossless Editors
  </text>

  <!-- Capability Badges/Pills in Foreground -->
  <g transform="translate(600, 260)">
    <!-- Pill 1: Codecs -->
    <g transform="translate(-360, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e1b4b" fill-opacity="0.9" stroke="#818cf8" stroke-width="1.2"/>
      <text text-anchor="middle" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e0e7ff">
        🎬 AV1 • HEVC • H.264
      </text>
    </g>

    <!-- Pill 2: Audio Formats -->
    <g transform="translate(-120, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#064e3b" fill-opacity="0.8" stroke="#34d399" stroke-width="1.2"/>
      <text text-anchor="middle" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#a7f3d0">
        🎵 FLAC • Opus • AAC
      </text>
    </g>

    <!-- Pill 3: Hardware Acceleration -->
    <g transform="translate(125, 0)">
      <rect x="-100" y="-18" width="200" height="36" rx="18" fill="#431407" fill-opacity="0.85" stroke="#fb923c" stroke-width="1.2"/>
      <text text-anchor="middle" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fed7aa">
        ⚡ NVENC • QSV • Apple VT
      </text>
    </g>

    <!-- Pill 4: FFmpeg Engines -->
    <g transform="translate(365, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2"/>
      <text text-anchor="middle" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#bae6fd">
        🛠️ HandBrake • FFmpeg
      </text>
    </g>
  </g>

  <!-- Bottom Metric / Tagline Bar -->
  <g transform="translate(600, 332)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
      Curated with detailed pricing, free tier limits, company valuations, GitHub star counts &amp; FFmpeg recipes
    </text>
  </g>
</svg>
